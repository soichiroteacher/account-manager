<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アカウント管理アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>アカウント管理アプリ</h1>
  <div class="header-actions">
    <button id="btnAddStudent" class="btn btn-primary">生徒を追加</button>
    <button id="btnExportExcel" class="btn">Excel書き出し</button>
    <button id="btnImportExcel" class="btn">Excel読み込み</button>
    <button id="btnExcelTemplate" class="btn">Excelテンプレート</button>
    <input type="file" id="fileImportExcel" accept=".xlsx,.xls" hidden>
    <button id="btnExportJson" class="btn">バックアップ書き出し</button>
    <button id="btnImportJson" class="btn">バックアップ読み込み</button>
    <input type="file" id="fileImportJson" accept="application/json" hidden>
    <button id="btnSheetLayout" class="btn">シートレイアウト設定</button>
    <button id="btnPrintAllSheets" class="btn">全員分シートPDF出力</button>
  </div>
</header>

<main>
  <div id="backupStatus" class="backup-status" hidden></div>
  <section class="toolbar">
    <input type="text" id="searchBox" placeholder="氏名・クラス・出席番号で検索">
  </section>

  <div class="table-wrap">
  <table id="studentTable" class="student-table">
    <thead>
      <tr>
        <th>クラス</th>
        <th>出席番号</th>
        <th>氏名</th>
        <th>Google ID</th>
        <th>その他サービス</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="studentTableBody"></tbody>
  </table>
  </div>
  <p id="emptyMessage" class="empty-message" hidden>登録された生徒がいません。「生徒を追加」から登録してください。</p>
</main>

<div id="studentModal" class="modal-overlay" hidden>
  <div class="modal">
    <h2 id="modalTitle">生徒を追加</h2>
    <form id="studentForm">
      <input type="hidden" id="studentId">

      <fieldset>
        <legend>基本情報</legend>
        <label>氏名 <input type="text" id="fieldName" required></label>
        <label>クラス <input type="text" id="fieldClass" placeholder="例: 1年2組" required></label>
        <label>出席番号 <input type="text" id="fieldNumber" required></label>
      </fieldset>

      <fieldset>
        <legend>Googleアカウント</legend>
        <label>Google ID <input type="text" id="fieldGoogleId" placeholder="example@school.jp"></label>
        <label>初期パスワード <input type="text" id="fieldGooglePassword"></label>
      </fieldset>

      <fieldset>
        <legend>その他の学習サービスアカウント</legend>
        <div id="otherServicesList"></div>
        <button type="button" id="btnAddOtherService" class="btn btn-small">+ サービスを追加</button>
      </fieldset>

      <div class="modal-actions">
        <button type="button" id="btnCancelModal" class="btn">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="sheetLayoutModal" class="modal-overlay" hidden>
  <div class="modal modal-wide">
    <h2>アカウントシートのレイアウト設定</h2>
    <p class="modal-help">チェックで表示/非表示を切り替え、▲▼で並び順を変更できます。右側でプレビューを確認できます。</p>
    <div class="layout-editor">
      <div class="layout-controls">
        <ul id="layoutItemList" class="layout-item-list"></ul>
        <div class="sheet-options">
          <label>タイトル <input type="text" id="optTitle"></label>
          <label>上部テキスト(学校名など) <textarea id="optHeaderText" rows="2"></textarea></label>
          <label>下部テキスト(ログインURL・注意書きなど) <textarea id="optFooterText" rows="3"></textarea></label>
          <label>全員分PDFの1ページあたりの人数
            <select id="optPerPage">
              <option value="1">1人</option>
              <option value="2">2人(切り取り線つき)</option>
              <option value="4">4人(切り取り線つき)</option>
            </select>
          </label>
        </div>
      </div>
      <div class="layout-preview-wrap">
        <div id="layoutPreview" class="layout-preview"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" id="btnCloseSheetLayout" class="btn btn-primary">閉じる</button>
    </div>
  </div>
</div>

<div id="importModal" class="modal-overlay" hidden>
  <div class="modal">
    <h2>Excelの読み込み</h2>
    <p id="importSummary"></p>
    <label class="radio-row">
      <input type="radio" name="importMode" value="merge" checked>
      <span><strong>追加・更新</strong><br>クラス＋出席番号が一致する生徒は更新し、それ以外は追加します。空欄のセルは既存の値を変更しません。</span>
    </label>
    <label class="radio-row">
      <input type="radio" name="importMode" value="replace">
      <span><strong>すべて置き換え</strong><br>現在のデータを削除して、Excelの内容に置き換えます。</span>
    </label>
    <div class="modal-actions">
      <button type="button" id="btnCancelImport" class="btn">キャンセル</button>
      <button type="button" id="btnConfirmImport" class="btn btn-primary">読み込む</button>
    </div>
  </div>
</div>

<div id="sheetPreviewArea" class="sheet-render-area" aria-hidden="true"></div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/html2canvas.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
